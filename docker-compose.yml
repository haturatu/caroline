services:
  caroline:
    build: .
    container_name: caroline
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      ALERTS_FILE: /data/alerts.json
      # Set this to the public URL so alert notifications can link to Explorer.
      CAROLINE_URL: ${CAROLINE_URL:-}
    volumes:
      # Caroline only calls read APIs, but the Docker socket itself is the
      # standard Engine API transport and must be mounted to discover logs.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - caroline-data:/data
    restart: unless-stopped

volumes:
  caroline-data:
