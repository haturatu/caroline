services:
  caroline:
    build: .
    container_name: caroline
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      CAROLINE_DATA_DIR: /data
      CAROLINE_DB: /data/caroline.db
      CAROLINE_HUB_KEY: /data/hub.key
      ALERTS_FILE: /data/alerts.json
      # Set this to the public URL so alert notifications can link to Explorer.
      CAROLINE_URL: ${CAROLINE_URL:-}
      # Set this when generating one-command Agent enrollment URLs.
      CAROLINE_PUBLIC_URL: ${CAROLINE_PUBLIC_URL:-}
    volumes:
      - caroline-data:/data
    restart: unless-stopped

volumes:
  caroline-data:
