name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Run Biome lint
        run: npm run lint

      - name: Type-check frontend
        run: npm run typecheck

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check Go formatting
        run: |
          gofmt_output="$(find . -type f -name '*.go' -not -path './vendor/*' -exec gofmt -l {} +)"
          test -z "$gofmt_output"

      - name: Run Go vet
        run: go vet ./...

      - name: Run Go tests
        run: go test ./...
